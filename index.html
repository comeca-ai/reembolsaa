<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reembolsaaí — gestão de despesas e compliance de reembolsos, multi-empresa." />
    <title>Reembolsaaí</title>
    <script>
      // Aplica o tema antes da pintura para evitar flash. Claro é o padrão;
      // só fica escuro se o usuário tiver escolhido (ver src/lib/ThemeContext).
      (function () {
        try {
          if (localStorage.getItem("reembolsaa-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* claro por padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Chatwoot é montado pelo React (src/components/ChatwootWidget.jsx) com o
         inbox certo por contexto de auth: vendas (deslogado) x suporte (logado). -->
  </body>
</html>
